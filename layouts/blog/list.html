{{ define "main" }}
<section id="blogList" class="py-8">
    <div class="px-6 max-w-7xl mx-auto">
        <div class="mb-8">
            <span
                class="inline-flex items-center gap-2 py-1.5 px-4 text-xs font-semibold tracking-wider uppercase text-stone-600 rounded-full border border-stone-200 bg-white"
            >
                <span class="relative flex h-2 w-2">
                    <span
                        class="absolute inline-flex h-full w-full animate-ping rounded-full bg-red-400 opacity-75"
                    ></span>
                    <span
                        class="relative inline-flex h-2 w-2 rounded-full bg-red-600"
                    ></span>
                </span>
                {{ .Params.eyebrow }}
            </span>
        </div>

        <h1
            class="text-3xl md:text-5xl font-bold tracking-tight text-slate-900 mb-5 max-w-3xl"
        >
            {{ .Params.heading_accent }}
            <span class="text-stone-400">{{ .Params.heading }}</span>
        </h1>

        <p class="text-lg md:text-xl text-slate-500 leading-relaxed max-w-2xl">
            {{ .Params.intro | markdownify }}
        </p>

        <hr class="mt-10 border-slate-200" />
    </div>

    <div class="max-w-7xl mx-auto px-6 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {{ range .Pages }}
            <article class="flex">
                <a href="{{ .RelPermalink }}"
                    class="group w-full block rounded-3xl p-4 border border-slate-100 transition-all duration-300 hover:shadow-xl hover:shadow-red-100/50 hover:-translate-y-1 flex flex-col">
                    <div class="relative aspect-video overflow-hidden rounded-2xl">
                        <img src="{{ .Params.image | default "/img/pic1.jpg" }}" alt="{{ .Title }}"
                            class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-105">
                    </div>
                    <div class="mt-5 px-1 flex-grow">
                        <div class="flex items-center gap-2 text-xs font-medium text-slate-500 mb-3">
                            <span>{{ .Date.Format "02 Jan 2006" }}</span>
                            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                            <span>{{ .ReadingTime }} dk okuma</span>
                        </div>
                        <h3
                            class="text-xl font-bold text-slate-900 leading-snug group-hover:text-brand transition-colors">
                            {{ .Title }}
                        </h3>
                    </div>
                </a>
            </article>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
