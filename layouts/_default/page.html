{{ define "css" }}
    <link rel="stylesheet" href="/css/page.css">
{{ end }}

{{ define "main" }}
<section id="{{ .Params.section_id | default "pageSection" }}" class="content-page-section">
    <!-- Üst Başlık ve Tanıtım Alanı -->
    <div class="page-intro-header">
        <div class="eyebrow-container">
            <span class="status-badge">
                <span class="pulse-indicator">
                    <span class="pulse-ring"></span>
                    <span class="pulse-dot"></span>
                </span>
                {{ .Params.eyebrow }}
            </span>
        </div>

        <h1 class="page-title">
            {{ .Params.heading_accent }}
            <span class="title-light">{{ .Params.heading }}</span>
        </h1>

        <p class="page-description">
            {{ .Params.intro | markdownify }}
        </p>

        <hr class="page-divider" />
    </div>

    <!-- Dinamik İçerik Alanı (Formatlı Yazı Sınıfı Eklendi) -->
    <div class="page-dynamic-body article-body">
        {{ .Content }}
    </div>
</section>
{{ end }}
