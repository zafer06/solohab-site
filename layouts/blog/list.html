{{ define "css" }}
    <link rel="stylesheet" href="/css/blog.css">
{{ end }}

{{ define "main" }}
<section id="blogList" class="blog-list-section">
    <div class="blog-list-header-container">
        <div class="eyebrow-wrapper">
            <span class="blog-eyebrow">
                <span class="ping-container">
                    <span class="ping-animate"></span>
                    <span class="ping-dot"></span>
                </span>
                {{ .Params.eyebrow }}
            </span>
        </div>

        <h1 class="blog-main-title">
            {{ .Params.heading_accent }}
            <span class="title-muted">{{ .Params.heading }}</span>
        </h1>

        <p class="blog-intro-text">
            {{ .Params.intro | markdownify }}
        </p>

        <hr class="page-divider border-top border-2 opacity-50 my-4" />
    </div>

    <div class="blog-grid-container">
        <div class="blog-posts-grid">
            {{ range .Pages }}
            <article class="blog-card-article">
                <a href="{{ .RelPermalink }}" class="blog-card-link">
                    <div class="blog-card-image-wrapper">
                        <img src="{{ .Params.image | default "/img/pic1.jpg" }}" alt="{{ .Title }}" class="blog-card-img">
                    </div>
                    <div class="blog-card-content">
                        <div class="blog-card-meta">
                            <span>{{ .Date.Format "02 Jan 2006" }}</span>
                            <span class="meta-dot-divider"></span>
                            <span>{{ .ReadingTime }} dk okuma</span>
                        </div>
                        <h3 class="blog-card-title">
                            {{ .Title }}
                        </h3>
                    </div>
                </a>
            </article>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
