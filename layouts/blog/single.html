{{ define "main" }}
<div class="max-w-7xl mx-auto px-6 py-12">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <header class="mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-6 leading-tight">
                {{ .Title }}
            </h1>
            <div class="flex items-center justify-between py-5 border-y border-slate-100">
                <div class="flex items-center gap-2.5 text-slate-500">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-widest">{{ .ReadingTime }} Dakika
                        Okuma</span>
                </div>

                <div class="flex items-center gap-4">
                    <button onclick="window.print()"
                        class="text-slate-400 hover:text-brand transition-colors p-1" title="Yazdır">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 00-2 2h2m2 4h10a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h6z">
                            </path>
                        </svg>
                    </button>
                    <button onclick="navigator.clipboard.writeText(window.location.href)"
                        class="text-slate-400 hover:text-brand transition-colors p-1"
                        title="Bağlantıyı Kopyala">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <article class="prose max-w-none">
            {{ .Content }}
        </article>
    </div>
</div>
{{end}}
