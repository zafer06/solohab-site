{{ define "css" }}
    <link rel="stylesheet" href="/css/blog.css">
{{ end }}

{{ define "main" }}
<div class="page-layout-container">
    <div class="page-content-wrapper">
        <header class="page-header">
            <h1 class="page-main-title">
                {{ .Title }}
            </h1>
            <div class="page-meta-bar">
                <div class="meta-reading-time">
                    <div class="meta-icon-wrapper">
                        <svg class="icon-clock" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="meta-reading-text">{{ .ReadingTime }} Dakika Okuma</span>
                </div>

                <div class="meta-action-buttons">
                    <button onclick="window.print()" class="btn-meta-action" title="Yazdır">
                        <svg class="icon-action" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 00-2 2h2m2 4h10a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h6z">
                            </path>
                        </svg>
                    </button>
                    <button onclick="navigator.clipboard.writeText(window.location.href)" class="btn-meta-action" title="Bağlantıyı Kopyala">
                        <svg class="icon-action" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <article class="article-body">
            {{ .Content }}
        </article>
    </div>
</div>
{{end}}
